<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#07070a;--panel:#0e0e13;--ink:#f4f4f6;--mute:#8d8d9a;--red:#ff1744;--glow:rgba(255,23,68,.55);--line:#22222b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px Rajdhani,system-ui,sans-serif;min-height:100vh;overflow-x:hidden;
background-image:radial-gradient(ellipse at 50% -10%,rgba(255,23,68,.22),transparent 55%),linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:auto,44px 44px,44px 44px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
header{max-width:1200px;margin:0 auto;padding:18px 18px 8px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:48px;height:48px;border:2px solid var(--red);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 18px var(--glow),inset 0 0 12px var(--glow)}
h1{margin:0;font:800 clamp(20px,4vw,32px) Orbitron,sans-serif;letter-spacing:.12em;text-shadow:0 0 16px var(--glow)}h1 b{color:var(--red)}
.sub{color:var(--red);font-size:12px;letter-spacing:.45em}

.score small{font:700 11px Rajdhani;letter-spacing:.25em;color:var(--mute)}.score .w{color:#fff}.score .r{color:var(--red);text-shadow:0 0 12px var(--glow)}
.score b.pop{display:inline-block;animation:pop .6s}@keyframes pop{40%{transform:scale(1.7)}}
main{max-width:1200px;margin:0 auto;padding:6px 12px 40px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}

.stage{position:relative;border:1px solid var(--line);background:rgba(10,10,14,.7);touch-action:none;user-select:none}

.bot{cursor:grab;outline:none}.bot:active{cursor:grabbing}
.tag circle{fill:#07070a;stroke:var(--red);stroke-width:2}.tag text{fill:#fff;font:700 11px Rajdhani;text-anchor:middle}
.tag .pill{opacity:0;transition:.25s}.tag .pill rect{fill:var(--red)}.tag .pill text{font:800 10px Orbitron;letter-spacing:.08em}
.bot:hover .pill,.bot.sel .pill,.bot:focus-visible .pill{opacity:1}.bot.sel .tag circle{fill:var(--red)}
.ring{fill:none;stroke:var(--red);stroke-width:3.5;stroke-dasharray:14 8;filter:drop-shadow(0 0 8px var(--red));animation:sp 5s linear infinite}

@keyframes du{to{transform:scale(2.5) translateY(-6px);opacity:0}}

.arm{animation:arm 2.4s ease-in-out infinite alternate;transform-origin:0 -34px}@keyframes arm{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.blink{animation:bk 1.2s steps(2) infinite}@keyframes bk{50%{opacity:.25}}
.spark{fill:#fff;animation:sk .4s ease-out forwards}@keyframes sk{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.flk{animation:fk .12s steps(2) infinite;transform-box:fill-box;transform-origin:right center}@keyframes fk{50%{transform:scaleX(.7)}}
.shake{animation:shk .25s}@keyframes shk{25%{transform:translate(3px,-2px)}75%{transform:translate(-3px,2px)}}

.num{font:800 72px/1 Orbitron;color:transparent;-webkit-text-stroke:2px var(--red);text-shadow:0 0 22px var(--glow)}

.list button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;padding:7px 8px;border:1px solid var(--line);font-weight:700;font-size:13px;letter-spacing:.08em;transition:.2s}
.list button i{font:800 11px Orbitron;color:var(--red);font-style:normal}
.list button:hover,.list button[aria-pressed=true]{border-color:var(--red);background:rgba(255,23,68,.12);box-shadow:0 0 14px rgba(255,23,68,.25)}
.list button:focus-visible,.btn:focus-visible{outline:2px solid #fff}
.btn{all:unset;cursor:pointer;text-align:center;padding:10px;border:1px solid var(--red);color:var(--red);font:800 12px Orbitron;letter-spacing:.2em}.btn:hover{background:var(--red);color:#000}
.stage{box-shadow:inset 0 0 110px rgba(0,0,0,.65),0 0 46px rgba(255,23,68,.14)}
.sweep{animation:sw 7s linear infinite}@keyframes sw{from{transform:translateX(0) skewX(-28deg)}to{transform:translateX(1100px) skewX(-28deg)}}
.mote{fill:#ff5a78;opacity:0;animation:mt linear infinite}@keyframes mt{0%{opacity:0;transform:translateY(0)}20%{opacity:.8}100%{opacity:0;transform:translateY(-70px)}}
.pls{animation:pl 1.6s ease-in-out infinite alternate}@keyframes pl{from{opacity:.4}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.sweep,.mote,.pls{animation:none}}
.ctl{display:none;grid-column:1/-1;justify-content:space-between;align-items:center;gap:12px;padding:2px 6px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
